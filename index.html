  #ftrig[aria-expanded="true"] .chev { transform: rotate(180deg); }
  #fmenu { position: absolute; top: calc(100% + 6px); left: 0; width: max(100%, 260px); max-height: min(60vh, 460px); overflow-y: auto; margin: 0; padding: 6px; list-style: none;

};
const COLORS = ['#0e7c66', '#2563eb', '#c2410c', '#7c3aed', '#be123c', '#0e7490', '#a16207', '#4d7c0f', '#db2777', '#475569', '#9333ea', '#15803d', '#b45309', '#1d4ed8'];
const types = [...new Set(DATA.map(d => d.type))].sort();
const color = t => COLORS[types.indexOf(t) % COLORS.length];
const icon = t => ICONS[t] || ICONS['کلینیک'];
const fa = n => n.toLocaleString('fa-IR');
const faDigits = s => s.replace(/[0-9]/g, c => '۰۱۲۳۴۵۶۷۸۹'[c]);
// unify letters, digits, diacritics and separators so «ي»=«ی», «290»=«۲۹۰», «وَنک»=«ونک»
const norm = s => faDigits(s.replace(/ي/g, 'ی').replace(/ك/g, 'ک').replace(/[٠-٩]/g, c => '۰۱۲۳۴۵۶۷۸۹'[c.charCodeAt(0) - 0x660]))
  .replace(/[ً-ْ]/g, '').replace(/[‌\-–_]/g, ' ').replace(/\s+/g, ' ').trim();
// spaces are dropped when matching, so «ولیعصر» finds «ولی عصر» and the other way round
DATA.forEach(d => d.flat = norm(`${d.title} ${d.address} ${d.type}`).replace(/ /g, ''));
const phonesOf = d => [...new Set(d.phone.split(/\s+/).filter(Boolean))];

const $ = id => document.getElementById(id);
const list = $('list'), q = $('q'), near = $('near');
$('title').textContent = document.title = APP_NAME;
if (UPDATED) { $('sub').textContent = `به‌روزرسانی فهرست: ${UPDATED}`; $('sub').hidden = false; }

const center = [35.715, 51.39];
const map = NESHAN_KEY
  ? new L.Map('map', { key: NESHAN_KEY, maptype: 'neshan', poi: false, traffic: false, center, zoom: 12, zoomControl: false })
  : L.map('map', { zoomControl: false }).setView(center, 12);
if (!NESHAN_KEY) L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
L.control.zoom({ zoomInTitle: 'بزرگ‌نمایی', zoomOutTitle: 'کوچک‌نمایی' }).addTo(map);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
// nearby pins merge into a numbered circle until zoomed in, so each pin is tappable
const layer = L.markerClusterGroup({
  maxClusterRadius: 45, disableClusteringAtZoom: 16, showCoverageOnHover: false, spiderfyOnMaxZoom: false, animate: !reduceMotion,
  iconCreateFunction: c => { const n = c.getChildCount(), s = n < 10 ? 36 : n < 100 ? 42 : 50;
    return L.divIcon({ className: '', html: `<div class="cluster" style="width:${s}px;height:${s}px">${fa(n)}</div>`, iconSize: [s, s] }); },
}).addTo(map);

let selected = '', me = null, meMarker = null, matches = [], shown = [], limit = 0, popupOpen = false;
const PAGE = 60; // list rows rendered at a time; the rest load with «نمایش بیشتر»
const UA = navigator.userAgent, ANDROID = /Android/.test(UA),
  IOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

let toastTimer;
const toast = msg => {
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 4000);
};

const km = (a, b) => { // haversine
  const r = Math.PI / 180, dLat = (b[0] - a[0]) * r, dLng = (b[1] - a[1]) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLng / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(h));
};
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pinIcons = Object.fromEntries(types.map(t => [t, L.divIcon({
  className: '', html: `<div class="pin" style="--c:${color(t)};width:30px;height:30px">${icon(t)}</div>`, iconSize: [30, 30], iconAnchor: [15, 36], popupAnchor: [0, -34] })]));

// service-type dropdown (custom, since a native <select> can't show the icons)
const ftrig = $('ftrig'), fmenu = $('fmenu');
const ALL_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>';
const CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
const setTrigger = () => {
  ftrig.style.setProperty('--c', selected ? color(selected) : 'var(--primary)');
  ftrig.innerHTML = (selected ? icon(selected) : ALL_ICON) + `<span>${selected || 'همه خدمات'}</span>` + CHEV;
};
['', ...types].forEach(t => {
  const li = document.createElement('li'); li.setAttribute('role', 'none');
  li.innerHTML = `<button class="opt" type="button" role="menuitemradio" aria-checked="${!t}" data-t="${t}">
    <span class="badge" style="--c:${t ? color(t) : 'var(--primary)'}">${t ? icon(t) : ALL_ICON}</span>
    <span>${t || 'همه خدمات'}</span><small>${fa(t ? DATA.filter(d => d.type === t).length : DATA.length)}</small></button>`;
  li.firstChild.onclick = () => {
    selected = t;
    fmenu.querySelectorAll('.opt').forEach(o => o.setAttribute('aria-checked', o.dataset.t === t));
    setTrigger(); toggleMenu(false); ftrig.focus(); render(true);
  };
  fmenu.append(li);
});
function toggleMenu(open) {
  fmenu.hidden = !open; ftrig.setAttribute('aria-expanded', open);
  if (open) fmenu.querySelector('[aria-checked="true"]').focus();
}
ftrig.onclick = () => toggleMenu(fmenu.hidden);
document.addEventListener('click', e => { if (!fmenu.hidden && !e.target.closest('.filter')) toggleMenu(false); });
fmenu.onkeydown = e => {
  const opts = [...fmenu.querySelectorAll('.opt')], i = opts.indexOf(document.activeElement);
  if (e.key === 'Escape') { toggleMenu(false); ftrig.focus(); }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); opts[(i + (e.key === 'ArrowDown' ? 1 : -1) + opts.length) % opts.length].focus(); }
  else if (e.key === 'Tab') toggleMenu(false);
};
setTrigger();

const I = {
  route: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>',
  map: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  call: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
  share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>',
  locate: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg>',
  close: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
};

const gmapsDir = d => `https://www.google.com/maps/dir/?api=1&destination=${d.lat},${d.lng}`;
const tel = p => p.split('-')[0].replace(/\D/g, ''); // «02188803876-9» is a range; dial the first

function popup(d) {
  const ll = `${d.lat},${d.lng}`, phones = phonesOf(d), name = encodeURIComponent(d.title);
  // geo: opens the Android app picker; iOS and desktop don't understand it
  const route = ANDROID ? `geo:${ll}?q=${ll}(${name})` : IOS ? `https://maps.apple.com/?daddr=${ll}&q=${name}` : gmapsDir(d);
  return `<div class="pop" style="--c:${color(d.type)}"><h3>${esc(d.title)}</h3><span class="type">${esc(d.type)}</span>
    <p>${esc(d.address)}</p>
    ${phones.length ? `<div class="phones">تلفن: ${phones.map(p => `<a href="tel:${tel(p)}">${faDigits(esc(p))}</a>`).join('')}</div>` : ''}
    <div class="acts">
      <a class="main" href="${route}"${ANDROID ? '' : ' target="_blank" rel="noopener"'}>${I.route}مسیریابی</a>
      ${ANDROID || IOS ? `<a href="${gmapsDir(d)}" target="_blank" rel="noopener">${I.map}گوگل‌مپ</a>` : ''}
      ${phones.length ? `<a href="tel:${tel(phones[0])}">${I.call}تماس</a>` : ''}
      <button type="button" onclick="share(${d.id})">${I.share}اشتراک</button>
    </div>
    <p class="note">پیش از مراجعه، قرارداد و ساعت کاری را تلفنی بپرسید.</p></div>`;
}

// a shared link opens this app on the same center (#c=id); outside http(s) fall back to Google Maps
const appLink = id => location.protocol.startsWith('http') ? `${location.href.split('#')[0]}#c=${id}` : '';
window.share = async id => {
  const d = DATA.find(x => x.id === id), link = appLink(id);
  const text = [d.title, d.address, phonesOf(d).join(' - '), link && `مسیر در گوگل‌مپ: ${gmapsDir(d)}`].filter(Boolean).join('\n');
  const url = link || gmapsDir(d);
  if (navigator.share) return navigator.share({ title: d.title, text, url }).catch(() => {});
  try { await navigator.clipboard.writeText(`${text}\n${url}`); toast('مشخصات و لینک مرکز کپی شد'); }
  catch { toast('کپی انجام نشد؛ آدرس را از پنجره‌ی مرکز بردارید.'); }
};

function highlight(id, scroll) {
  list.querySelectorAll('li.on').forEach(li => li.classList.remove('on'));
  const idx = shown.findIndex(d => d.id === id);
  while (idx >= limit) showMore(); // a tapped pin may sit beyond the rows rendered so far
  const li = list.querySelector(`li[data-id="${id}"]`);
  li?.classList.add('on');
  if (scroll) li?.scrollIntoView({ block: 'nearest', behavior: reduceMotion ? 'auto' : 'smooth' });
}

// markers are built once; render() only adds/removes them
const markers = Object.fromEntries(DATA.map(d => [d.id,
  L.marker([d.lat, d.lng], { icon: pinIcons[d.type], title: d.title, keyboard: false }) // list is the keyboard path
    .bindPopup(() => popup(d), { autoPanPadding: [16, 16] })
    .on('click', () => highlight(d.id, true))]));
for (const id in markers) markers[id].cid = +id;
let onMap = new Set();
const setHash = h => { try { history.replaceState(null, '', h); } catch {} }; // throws on some sandboxed origins

map.on('popupopen', e => {
  popupOpen = true;
  const x = e.popup.getElement()?.querySelector('.leaflet-popup-close-button');
  x?.setAttribute('aria-label', 'بستن'); x?.setAttribute('title', 'بستن');
  const id = e.popup._source?.cid; // keep the address bar on the open center, so copying it shares that center
  if (id) setHash(`#c=${id}`);
});
map.on('popupclose', e => {
  popupOpen = false;
  if (location.hash === `#c=${e.popup._source?.cid}`) setHash(location.pathname + location.search);
});

function focus(d) {
  const m = markers[d.id];
  // put the marker near the bottom of the map so the popup above it is fully visible
  const h = map.getSize().y, pt = map.project([d.lat, d.lng], 16).subtract([0, h / 2 - 60]);
  map.setView(map.unproject(pt, 16), 16, { animate: false });
  layer.zoomToShowLayer(m, () => {
    m.openPopup();
    m.getPopup().getElement()?.querySelector('a, button')?.focus({ preventScroll: true });
  });
  highlight(d.id);
}

function row(d) {
  const li = document.createElement('li');
  li.dataset.id = d.id;
  li.innerHTML = `<button><span class="badge" style="--c:${color(d.type)}">${icon(d.type)}</span>
    <span><span class="t">${esc(d.title)}</span><span class="s">${esc(d.type)} · ${esc(d.address)}</span></span>
    ${me ? `<span class="dist">${fa(+d.dist.toFixed(1))} کیلومتر</span>` : ''}</button>`;
  li.firstChild.onclick = () => focus(d);
  return li;
}

function showMore() {
  list.querySelector('.more-li')?.remove();
  const frag = document.createDocumentFragment();
  shown.slice(limit, limit + PAGE).forEach(d => frag.append(row(d)));
  limit += PAGE;
  if (limit < shown.length) {
    const li = document.createElement('li'); li.className = 'more-li';
    li.innerHTML = `<button class="more">نمایش بیشتر (${fa(shown.length - limit)} مرکز دیگر)</button>`;
    li.firstChild.onclick = () => { const next = limit; showMore(); list.children[next]?.firstChild.focus(); };
    frag.append(li);
  }
  list.append(frag);
}

// list order follows the user: distance from them if located, otherwise from the middle of the map
function renderList() {
  const ref = me || [map.getCenter().lat, map.getCenter().lng];
  matches.forEach(d => d.dist = km(ref, [d.lat, d.lng]));
  shown = [...matches].sort((a, b) => a.dist - b.dist);
  $('count').textContent = shown.length ? `${fa(shown.length)} مرکز · ${me ? 'نزدیک‌ترین به شما' : 'نزدیک‌ترین به وسط نقشه'} در بالا` : '';
  list.innerHTML = ''; list.scrollTop = 0; limit = 0;
  if (!shown.length) list.innerHTML = `<li class="empty"><b>مرکزی پیدا نشد</b>بخشی از نام یا خیابان را بنویسید${selected ? ' یا «همه خدمات» را انتخاب کنید' : ''}.</li>`;
  else showMore();
}

function render(fit) {
  const words = norm(q.value).split(' ').filter(Boolean);
  matches = DATA.filter(d => (!selected || d.type === selected) && words.every(w => d.flat.includes(w)));
  const keep = new Set(matches.map(d => d.id));
  layer.removeLayers([...onMap].filter(id => !keep.has(id)).map(id => markers[id]));
  layer.addLayers(matches.filter(d => !onMap.has(d.id)).map(d => markers[d.id]));
  onMap = keep;
  if (fit && matches.length && !me) map.fitBounds(matches.map(d => [d.lat, d.lng]), { padding: [30, 30], maxZoom: 16, animate: false });
  renderList();
}

let moveTimer;
map.on('moveend', () => { // re-sort for the area the user is looking at (not while reading a popup)
  clearTimeout(moveTimer);
  moveTimer = setTimeout(() => { if (!me && !popupOpen) renderList(); }, 250); // checked late: a list tap moves the map, then opens its popup
});

let t;
q.oninput = () => { clearTimeout(t); t = setTimeout(() => render(true), 200); };
$('clear').onclick = () => { q.value = ''; q.focus(); render(true); };

// «near me»: idle → locating (spinner) → on (tap again to turn off)
function setNear(state) {
  near.setAttribute('aria-busy', state === 'busy');
  near.setAttribute('aria-pressed', state === 'on');
  near.disabled = state === 'busy';
  near.innerHTML = state === 'busy' ? `${I.locate}در حال یافتن…` : state === 'on' ? `${I.close}نزدیک من` : `${I.locate}نزدیک من`;
  near.setAttribute('aria-label', state === 'on' ? 'خاموش کردن مرتب‌سازی بر اساس فاصله از من' : 'مرتب‌سازی مراکز بر اساس فاصله از من');
}
near.onclick = () => {
  if (me) { me = null; meMarker?.remove(); setNear('off'); renderList(); return; }
  if (!navigator.geolocation) return toast('این مرورگر موقعیت مکانی را پشتیبانی نمی‌کند. نقشه را روی محله‌ی خود ببرید.');
  setNear('busy');
  navigator.geolocation.getCurrentPosition(p => {
    me = [p.coords.latitude, p.coords.longitude];
    setNear('on');
    meMarker?.remove();
    meMarker = L.circleMarker(me, { radius: 9, color: '#fff', weight: 3, fillColor: '#2563eb', fillOpacity: 1 }).addTo(map).bindPopup('موقعیت شما');
    map.setView(me, 15); renderList();
  }, err => {
    setNear('off');
    toast(err.code === 1
      ? 'اجازه‌ی موقعیت مکانی داده نشده. از تنظیمات مرورگر برای این سایت فعالش کنید.'
      : 'موقعیت شما پیدا نشد. دوباره امتحان کنید یا نقشه را روی محله‌ی خود ببرید.');
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
};
setNear('off');

// mobile list sheet: tap the grip to cycle sizes, or drag it
const main = $('main'), grip = $('grip'), SIZES = [.18, .36, .75];
let sheet = 1, dragY = null;
const setSheet = px => { main.style.setProperty('--sheet', px + 'px'); map.invalidateSize(); };
const snap = i => { sheet = i; setSheet(main.clientHeight * SIZES[i]); grip.setAttribute('aria-expanded', i === 2); };
grip.onpointerdown = e => { dragY = { y: e.clientY, h: $('list').parentElement.offsetHeight, moved: false }; grip.setPointerCapture(e.pointerId); };
grip.onpointermove = e => {
  if (!dragY) return;
  const dy = dragY.y - e.clientY;
  if (Math.abs(dy) > 6) dragY.moved = true;
  if (dragY.moved) setSheet(Math.min(main.clientHeight - 60, Math.max(60, dragY.h + dy)));
};
grip.onpointerup = () => {
  if (!dragY) return;
  if (dragY.moved) { // snap to the nearest size
    const f = $('list').parentElement.offsetHeight / main.clientHeight;
    snap(SIZES.reduce((b, s, i) => Math.abs(s - f) < Math.abs(SIZES[b] - f) ? i : b, 0));
  } else snap((sheet + 1) % SIZES.length);
  dragY = null;
};
grip.onkeydown = e => { if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); snap(Math.max(0, Math.min(2, sheet + (e.key === 'ArrowUp' ? 1 : -1)))); } };
grip.onclick = e => { if (e.detail === 0) snap((sheet + 1) % SIZES.length); }; // keyboard Enter/Space

render();
// open a shared center: …#c=123
const openHash = () => { const d = DATA.find(x => `#c=${x.id}` === location.hash); if (d) focus(d); };
addEventListener('hashchange', openHash);
openHash();
</script>
</body>
</html>
